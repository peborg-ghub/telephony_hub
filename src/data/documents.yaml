# ─────────────────────────────────────────────────────────────────────────────
# Cloud Telephony Resource Hub — every document and link on the site.
#
# To add a document:
#   1. Put the file in the matching folder under public/files/
#   2. Copy one entry below, paste it at the TOP of its section, and edit it.
#   3. Run `npm run build`. If anything is wrong, the build tells you what and where.
#
# Fields
#   title        required
#   description  required, 200 characters max
#   section      required: practice-info | ai-projects | power-bi
#   subsection   ai-projects ONLY: soundhound | sierra | iva-studio  (leave out for other sections)
#   file         path under public/files/ — e.g. power-bi/q3-report.pdf   ┐ use exactly
#   url          full https:// link, for external pages/spreadsheets        ┘ ONE of these
#   dateAdded    required, YYYY-MM-DD
#   owner        optional, defaults to "Pete"
#   tags         optional, e.g. [reporting, call-volume]
#
# Supported file types: PDF, DOCX, DOC, XLSX, XLS, CSV, PPTX
# Entries marked "SAMPLE –" are placeholders. Delete them (and their files) when you add real content.
# ─────────────────────────────────────────────────────────────────────────────

